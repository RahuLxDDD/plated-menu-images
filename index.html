<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f0e7"><title>PLATED. — Menu Image Studio</title><style>:root{--bg:#f5f0e7;--ink:#111;--muted:#716d66;--card:#fffdf8;--line:#ddd4c7;--shadow:0 22px 70px rgba(49,40,29,.10)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{min-height:100vh;padding:24px}.top{max-width:1280px;margin:auto;font-size:21px;font-weight:950;letter-spacing:-.05em}.hero{max-width:980px;margin:8vh auto 42px;text-align:center}h1{font-size:clamp(52px,8vw,92px);line-height:.9;letter-spacing:-.078em;margin:0 auto 22px}.sub{font-size:clamp(16px,2vw,20px);color:var(--muted);margin-bottom:28px}.search{max-width:790px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow)}.search input{border:0;outline:0;background:transparent;padding:0 18px;font-size:19px;min-width:0}.search button{border:0;background:#141414;color:#fff;border-radius:999px;padding:16px 25px;font-weight:850}.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.chip,.uploadBtn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 13px;color:var(--muted);font-size:12px}.uploadBtn{font-weight:750;color:#222;background:#fff9}.status{max-width:1280px;margin:0 auto 15px;color:var(--muted);font-size:13px;min-height:22px}.grid{max-width:1280px;margin:auto;columns:4 260px;column-gap:14px}.card{break-inside:avoid;margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative}.card img{width:100%;display:block;min-height:170px;object-fit:cover;background:#e8e2d8}.meta{padding:11px 12px 13px}.metaTop{display:flex;justify-content:space-between;gap:8px;align-items:center}.source{font-size:11px;font-weight:850}.lic{font-size:9px;border:1px solid var(--line);border-radius:999px;padding:4px 6px;color:var(--muted)}.creator{font-size:10.5px;color:var(--muted);margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.use{position:absolute;right:10px;top:10px;border:0;border-radius:999px;background:#fffef5;padding:8px 10px;font-weight:850;font-size:11px;box-shadow:0 6px 20px #0002}.empty{text-align:center;color:var(--muted);max-width:1280px;margin:55px auto}.modal{display:none;position:fixed;inset:0;background:#0009;backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.editor{width:min(1000px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px;padding:18px}.editorTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.editorTitle{font-size:20px;font-weight:900}.close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:22px}.editorGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.stage{aspect-ratio:1;background:#e9e2d8;border-radius:20px;overflow:hidden}canvas{display:block;width:100%;height:100%}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}.label{text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:850;color:var(--muted);margin-bottom:6px}.control{margin-bottom:16px}.control input{width:100%}.actions{display:grid;gap:9px;margin-top:18px}.primary,.secondary{border-radius:14px;padding:13px 14px;font-weight:850}.primary{border:0;background:#151515;color:#fff}.secondary{border:1px solid var(--line);background:transparent}.note{font-size:10.5px;line-height:1.5;color:var(--muted);margin-top:12px}.spinner{display:inline-block;width:13px;height:13px;border:2px solid #0002;border-top-color:#111;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){.wrap{padding:16px}.hero{margin-top:10vh}.search{grid-template-columns:1fr;border-radius:22px}.search input{text-align:center;padding:10px}.search button{width:100%}.editorGrid{grid-template-columns:1fr}.grid{columns:2 150px}}</style></head><body><div class="wrap"><header class="top">PLATED.</header><main><section class="hero"><h1>What are we plating today?</h1><div class="sub">Find a real photo or upload your own. Make it menu-ready in seconds.</div><form class="search" id="searchForm"><input id="q" placeholder="Paneer Butter Masala" autocomplete="off"><button>Find images ✦</button></form><div class="tools"><button class="chip" data-q="masala dosa">Masala Dosa</button><button class="chip" data-q="chicken biryani">Chicken Biryani</button><button class="chip" data-q="paneer butter masala">Paneer Butter Masala</button><button class="chip" data-q="samosa">Samosa</button><button class="chip" data-q="idli">Idli</button><button class="uploadBtn" id="uploadBtn">Upload merchant photo ↗</button><input id="upload" type="file" accept="image/*" hidden></div></section><div class="status" id="status">Search a dish or upload a merchant photo.</div><section class="grid" id="grid"></section><div class="empty" id="empty">Real Wikimedia Commons food photos will appear here.</div></main></div><div class="modal" id="modal"><div class="editor"><div class="editorTop"><div class="editorTitle">Menu-ready square</div><button class="close" id="close">×</button></div><div class="editorGrid"><div class="stage"><canvas id="canvas" width="1080" height="1080"></canvas></div><div class="panel"><div class="control"><div class="label">Zoom</div><input id="zoom" type="range" min="1" max="2.5" step=".01" value="1"></div><div class="control"><div class="label">Horizontal</div><input id="xpos" type="range" min="-1" max="1" step=".01" value="0"></div><div class="control"><div class="label">Vertical</div><input id="ypos" type="range" min="-1" max="1" step=".01" value="0"></div><div class="actions"><button class="primary" id="download">Download 1080×1080 JPG</button><button class="secondary" id="sourcePage">Open source & license</button></div><div class="note" id="licenseNote"></div></div></div></div></div><script>const API='https://commons.wikimedia.org/w/api.php';const $=id=>document.getElementById(id);const form=$('searchForm'),q=$('q'),grid=$('grid'),statusEl=$('status'),empty=$('empty'),modal=$('modal'),canvas=$('canvas'),ctx=canvas.getContext('2d'),zoom=$('zoom'),xpos=$('xpos'),ypos=$('ypos'),upload=$('upload');let current=null,currentImg=null,currentTerm='';const STOP=new Set(['the','and','with','style','special','restaurant','hotel','plate','dish','food','indian','fresh','classic','deluxe','full','half','large','small','pcs','piece','pieces']);function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function strip(s=''){const d=document.createElement('div');d.innerHTML=s;return d.textContent||''}function clean(s=''){return strip(s).toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}function toks(s){return clean(s).split(' ').filter(x=>x.length>1&&!STOP.has(x))}function lic(m){return m?.LicenseShortName?.value||m?.UsageTerms?.value||'See license'}function creator(m){return strip(m?.Artist?.value||m?.Credit?.value||'Wikimedia contributor').replace(/\s+/g,' ').trim()}function variants(t){const c=clean(t),a=[c,c+' dish',c+' curry',c+' indian food'];if(c.includes('butter masala'))a.push(c.replace('butter masala','makhani'));if(c.includes('roti'))a.push(c.replace('tandoori roti','roti'),c.replace('tandoori roti','naan'));if(c.includes('biryani'))a.push(c+' rice');return [...new Set(a)].slice(0,5)}function score(x,t){const qs=toks(t),title=clean(x.title),desc=clean(x.desc),cats=clean(x.cats),hay=title+' '+desc+' '+cats;let s=0;if(title.includes(clean(t)))s+=24;for(const w of qs){if(title.includes(w))s+=8;if(desc.includes(w))s+=3;if(cats.includes(w))s+=2}if(qs.length&&qs.every(w=>hay.includes(w)))s+=14;for(const b of ['map','logo','flag','building','person','portrait','menu card','sign','packaging','shop','exterior','diagram','drawing','painting','poster'])if(hay.includes(b))s-=9;return s}async function batch(term){const p=new URLSearchParams({action:'query',format:'json',origin:'*',generator:'search',gsrsearch:term,gsrnamespace:'6',gsrlimit:'28',prop:'imageinfo|categories',cllimit:'max',iiprop:'url|extmetadata',iiurlwidth:'1000'});const r=await fetch(API+'?'+p);if(!r.ok)throw Error(r.status);const d=await r.json();return Object.values(d?.query?.pages||{}).filter(p=>p.imageinfo?.[0]).map(p=>{const ii=p.imageinfo[0],m=ii.extmetadata||{};return{key:p.pageid,title:(p.title||'').replace(/^File:/,''),thumb:ii.thumburl||ii.url,original:ii.url,sourcePage:ii.descriptionurl||('https://commons.wikimedia.org/wiki/'+encodeURIComponent(p.title)),creator:creator(m),license:lic(m),desc:m.ImageDescription?.value||m.ObjectName?.value||'',cats:(p.categories||[]).map(c=>c.title).join(' '),provider:'Wikimedia Commons'}})}async function search(term){currentTerm=term.trim();if(!currentTerm)return;statusEl.innerHTML='<span class="spinner"></span>Searching multiple food queries…';grid.innerHTML='';empty.style.display='none';try{const groups=await Promise.all(variants(currentTerm).map(batch));const map=new Map();groups.flat().forEach(x=>{if(!map.has(x.key))map.set(x.key,x)});let items=[...map.values()].map(x=>({...x,score:score(x,currentTerm)})).sort((a,b)=>b.score-a.score);const strong=items.filter(x=>x.score>=7);if(strong.length>=10)items=strong;items=items.slice(0,36);statusEl.textContent=items.length+' ranked matches for “'+currentTerm+'” · Wikimedia Commons';if(!items.length){empty.textContent='No close matches. Try a shorter dish name or upload a merchant photo.';empty.style.display='block';return}render(items)}catch(e){console.error(e);statusEl.textContent='Search failed.';empty.textContent='Wikimedia could not be reached. Try again or upload a merchant photo.';empty.style.display='block'}}function render(items){grid.innerHTML=items.map((x,i)=>`<article class="card"><img loading="lazy" referrerpolicy="no-referrer" src="${esc(x.thumb)}" alt="${esc(x.title)}"><button class="use" data-i="${i}">Use photo</button><div class="meta"><div class="metaTop"><div class="source">${esc(x.provider)}</div><div class="lic">${esc(x.license)}</div></div><div class="creator">${esc(x.title)}</div></div></article>`).join('');document.querySelectorAll('.use').forEach(b=>b.onclick=()=>openEditor(items[+b.dataset.i]))}function openEditor(item){current=item;modal.classList.add('open');zoom.value=1;xpos.value=0;ypos.value=0;$('sourcePage').style.display=item.sourcePage?'block':'none';$('licenseNote').textContent=item.sourcePage?`${item.license} · ${item.creator}. Verify attribution on the source page before publishing.`:'Merchant-owned upload · no external attribution required.';currentImg=new Image();currentImg.crossOrigin=item.sourcePage?'anonymous':null;currentImg.onload=draw;currentImg.onerror=()=>{alert('This photo cannot be opened. Try another one.');modal.classList.remove('open')};currentImg.src=item.thumb}function draw(){if(!currentImg?.naturalWidth)return;const cw=1080,ch=1080,iw=currentImg.naturalWidth,ih=currentImg.naturalHeight,base=Math.max(cw/iw,ch/ih),sc=base*+zoom.value,w=iw*sc,h=ih*sc,mx=Math.max(0,(w-cw)/2),my=Math.max(0,(h-ch)/2),xx=(cw-w)/2+(+xpos.value)*mx,yy=(ch-h)/2+(+ypos.value)*my;ctx.fillStyle='#eee7dd';ctx.fillRect(0,0,cw,ch);ctx.drawImage(currentImg,xx,yy,w,h)}[zoom,xpos,ypos].forEach(el=>el.oninput=draw);form.onsubmit=e=>{e.preventDefault();search(q.value)};document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{q.value=c.dataset.q;search(q.value)});$('uploadBtn').onclick=()=>upload.click();upload.onchange=()=>{const f=upload.files?.[0];if(!f)return;currentTerm=f.name.replace(/\.[^.]+$/,'')||'merchant-photo';const url=URL.createObjectURL(f);openEditor({title:f.name,thumb:url,creator:'Merchant upload',license:'Owned photo',provider:'Merchant upload',sourcePage:null})};$('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.onkeydown=e=>{if(e.key==='Escape')modal.classList.remove('open')};$('sourcePage').onclick=()=>current?.sourcePage&&window.open(current.sourcePage,'_blank','noopener');$('download').onclick=()=>{try{const a=document.createElement('a');a.download=(currentTerm||'menu-photo').replace(/\s+/g,'-').toLowerCase()+'-1080.jpg';a.href=canvas.toDataURL('image/jpeg',.94);a.click()}catch(e){alert('Export blocked for this photo. Try another result.')}};</script></body></html>
